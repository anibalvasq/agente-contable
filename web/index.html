<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wa-agent-starter · demo</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0b141a; color: #e9edef; display: flex; flex-direction: column; height: 100vh;
      }
      header { padding: 14px 18px; background: #202c33; font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
      header small { display: block; font-weight: 400; opacity: .6; font-size: 12px; margin-top: 2px; }
      #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
      .msg { max-width: 78%; padding: 8px 12px; border-radius: 10px; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
      .user { align-self: flex-end; background: #005c4b; }
      .bot { align-self: flex-start; background: #202c33; }
      .meta { align-self: center; opacity: .5; font-size: 12px; }
      form { display: flex; gap: 8px; padding: 12px; background: #202c33; }
      input { flex: 1; padding: 11px 14px; border-radius: 22px; border: none; background: #2a3942; color: #e9edef; font-size: 15px; }
      input:focus { outline: 2px solid #005c4b; }
      button { padding: 0 18px; border-radius: 22px; border: none; background: #00a884; color: #fff; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: .5; cursor: default; }
    </style>
  </head>
  <body>
    <header>
      wa-agent-starter · demo
      <small>Chat en memoria (se borra al reiniciar). Este es el frontend "app propia" del kit.</small>
    </header>
    <div id="log"></div>
    <form id="form">
      <input id="text" placeholder="Escribí un mensaje…" autocomplete="off" autofocus />
      <button id="send" type="submit">Enviar</button>
    </form>

    <script>
      // El id de sesión lo emite y firma el SERVER: el cliente solo lo guarda
      // y lo devuelve. Uno inventado acá no valida la firma y el server abre
      // una sesión nueva (ver src/channels/web/adapter.ts).
      let sessionId = sessionStorage.getItem('wa-agent-session') || null;
      const log = document.getElementById('log');
      const form = document.getElementById('form');
      const input = document.getElementById('text');
      const send = document.getElementById('send');

      function add(text, cls) {
        const el = document.createElement('div');
        el.className = 'msg ' + cls;
        el.textContent = text;
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
        return el;
      }

      add('Escribí para empezar. Probá "¿qué hora es?" o "¿cuál es el horario?".', 'meta');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        add(text, 'user');
        send.disabled = true;
        const typing = add('…', 'bot');
        try {
          const res = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sessionId, text }),
          });
          const data = await res.json();
          if (data.sessionId) {
            sessionId = data.sessionId;
            sessionStorage.setItem('wa-agent-session', sessionId);
          }
          typing.textContent = data.reply || '(sin respuesta)';
        } catch (err) {
          typing.textContent = 'Error de red: ' + err.message;
        } finally {
          send.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
