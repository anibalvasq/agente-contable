# Producción — Coolify.
#
# En Coolify: New Resource > Docker Compose, apunta al repo y pon este
# archivo en "Docker Compose Location": /docker-compose.coolify.yml
#
# Por qué es distinto al docker-compose.yml local:
#  - Incluye el servicio `app`. Local corre fuera de Docker (npm run dev).
#  - Postgres y Redis NO publican puertos: solo los alcanza `app` por la red
#    interna. Publicarlos en un server con IP pública es dejar la base abierta.
#  - `app` usa `expose`, no `ports`: el proxy de Coolify enruta por la red
#    interna y pone el TLS.
#  - SERVICE_FQDN_APP_3000 es una magic var de Coolify: genera el dominio y
#    apunta el proxy al puerto 3000.
#
# NO uses la sintaxis de variable obligatoria (dolar-llave VAR dos-puntos
# interrogacion mensaje) en este archivo.
#
# El build pack "Docker Compose" de Coolify parsea el compose ANTES de inyectar
# las variables de la aplicacion, con un entorno vacio. Cualquier variable
# marcada como obligatoria ahi aborta ese parseo, y Coolify lo reporta con un
# error generico y enganoso ("Failed to read Git source") que parece un
# problema de la deploy key.
#
# No hace falta: src/env.ts valida todo al arrancar con Zod y mata el proceso
# con un mensaje claro si falta algo. La validacion vive ahi, no aqui.

# Si usas STORE=memory (sin persistencia), puedes borrar el servicio `postgres`
# y su volumen, y quitar DATABASE_URL y el depends_on de postgres.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      - SERVICE_FQDN_APP_3000
      - NODE_ENV=production
      - PORT=3000
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Núcleo
      - STORE=${STORE:-postgres}
      - CHANNEL_ADAPTER=${CHANNEL_ADAPTER:-web}
      - DATABASE_URL=postgres://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-agent}
      - REDIS_URL=redis://redis:6379
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      # Firma obligatoria en producción. No lo pongas en false aquí.
      - WEBHOOK_REQUIRE_SIGNATURE=${WEBHOOK_REQUIRE_SIGNATURE:-true}
      - RATE_LIMIT_PER_IP=${RATE_LIMIT_PER_IP:-120}
      - RATE_LIMIT_PER_CONTACT=${RATE_LIMIT_PER_CONTACT:-15}
      # Sin esto, cada redeploy le borra la sesión a todo el mundo (canal web).
      - SESSION_SECRET=${SESSION_SECRET:-}
      # Clave del panel del estudio (/panel). Sin ella el panel queda apagado.
      - PANEL_PASSWORD=${PANEL_PASSWORD:-}
      # LLM. OpenRouter por defecto; para Anthropic u OpenAI directo, define
      # LLM_API_KEY y LLM_BASE_URL (mandan sobre OPENROUTER_*).
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-anthropic/claude-sonnet-4.5}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-1024}
      # Vacía por defecto: los modelos nuevos de Claude rechazan temperature con
      # un 400, y el compose antes la forzaba a 0.3 aunque no la definieras.
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-}
      - APP_TITLE=${APP_TITLE:-wa-agent-starter}
      - AGENT_CONFIG_PATH=${AGENT_CONFIG_PATH:-config/agent.yaml}
      - MESSAGE_DEBOUNCE_MS=${MESSAGE_DEBOUNCE_MS:-8000}
      - AGENT_MAX_TOOL_ITERATIONS=${AGENT_MAX_TOOL_ITERATIONS:-6}
      - AGENT_HISTORY_LIMIT=${AGENT_HISTORY_LIMIT:-40}
      - AGENT_REPLY_ENABLED=${AGENT_REPLY_ENABLED:-true}
      # Vars del canal elegido (ver .env.example). Pasa aquí las que use tu adapter,
      # p.ej. Cloud API: META_ACCESS_TOKEN, META_PHONE_NUMBER_ID, META_VERIFY_TOKEN.
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN:-}
      - META_PHONE_NUMBER_ID=${META_PHONE_NUMBER_ID:-}
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN:-}
      # Obligatorio con CHANNEL_ADAPTER=cloud-api: sin firma, tu número puede
      # ser usado para mandarle mensajes a cualquiera.
      - META_APP_SECRET=${META_APP_SECRET:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_USER_IDS=${TELEGRAM_ALLOWED_USER_IDS:-}
      - GHL_API_TOKEN=${GHL_API_TOKEN:-}
      - GHL_LOCATION_ID=${GHL_LOCATION_ID:-}
      - GHL_HANDOFF_TAG=${GHL_HANDOFF_TAG:-bot-handoff}
      - CHATWOOT_BASE_URL=${CHATWOOT_BASE_URL:-}
      - CHATWOOT_API_TOKEN=${CHATWOOT_API_TOKEN:-}
      - CHATWOOT_ACCOUNT_ID=${CHATWOOT_ACCOUNT_ID:-}
      - YCLOUD_API_KEY=${YCLOUD_API_KEY:-}
      # Avisos por mail. Sin RESEND_API_KEY todo queda en los logs.
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM:-onboarding@resend.dev}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-agent}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - POSTGRES_DB=${POSTGRES_DB:-agent}
    volumes:
      - wa-agent-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - wa-agent-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  wa-agent-pgdata:
  wa-agent-redisdata:
